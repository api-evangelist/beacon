aid: beacon
name: Beacon Biosignals
description: 'Beacon Biosignals is a neurotechnology company applying machine learning to EEG
  (electroencephalography) to advance precision medicine for conditions affecting the brain. Founded in
  2019 by Jacob Donoghue (MD, PhD) and Jarrett Revels, the company operates two lines of business: a
  life-sciences platform that collects, integrates and analyzes EEG across drug development and clinical
  trials (over 2 million hours of EEG processed across 40+ trials), and a home sleep testing business
  built on the SleepView Monitor and SleepView Direct platforms (500,000+ home sleep tests completed).
  Beacon acquired CleveMed in April 2025, and its Dreem 3S was authorized by the FDA in December 2024 as
  the first sleep wearable cleared with a predetermined change control plan. Beacon publishes no public
  REST API or developer portal; its public technical surface is a substantial open-source Julia ecosystem
  under the beacon-biosignals GitHub organization, including the Onda signal-data format, the Legolas
  schema framework, EDF.jl and Lighthouse.jl. Backed by General Catalyst, GV, Takeda, S32 and Innoviva.'
