notes: >-
  Beacon Biosignals publishes no API changelog, because it publishes no public API. Change communication
  happens on two separate surfaces: (1) per-package GitHub Releases for the open-source Julia ecosystem,
  each package versioned independently under SemVer and registered in the Julia General registry; and
  (2) a dated company news stream at https://beacon.bio/news for corporate, regulatory and partnership
  milestones. Both are captured below. Recent window only.
